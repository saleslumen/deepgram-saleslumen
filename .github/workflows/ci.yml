name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/live/draw.test.js tests/live/project.test.js
