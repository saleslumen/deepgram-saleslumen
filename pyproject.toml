[project]
name = "deepgram-saleslumen"
version = "0.1.0"
description = "Local voice demo that watches a Saleslumen workflow."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pipecat-ai[deepgram,mcp,openrouter,runner,webrtc]==1.17.0",
  "pydantic>=2.14.4,<3",
  "pydantic-settings>=2.16.3,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pipecat-ai[cli]==1.17.0",
]
